
name: Go Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-check:
    name: Build, Test and Security
    runs-on: ubuntu-latest

    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Установка Go 1.26
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      # Проверяем фактическую версию Go
      - name: Check Go version
        run: |
          go version
          go env GOTOOLCHAIN
          which go

      # Загрузка зависимостей
      - name: Download dependencies
        run: go mod download

      # Сборка
      - name: Build
        run: go build ./...

      # Тестирование
      - name: Run tests
        run: go test -v ./...

      # Анализ Go-кода
      - name: Go Vet
        run: go vet ./...

      # Установка govulncheck
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Проверка уязвимостей
      - name: Run govulncheck
        run: govulncheck ./...

      # Анализ безопасности
      - name: Gosec
        uses: securego/gosec@master
        with:
          args: ./...
